services:
  db:
    image: postgres:16-alpine
    container_name: qa-hub-db
    environment:
      POSTGRES_USER: qahub
      POSTGRES_PASSWORD: qahub_secret
      POSTGRES_DB: qahub
    ports:
      - "5432:5432"
    volumes:
      - qahub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qahub -d qahub"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - qa-network

  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-kvitnicki/qa-hub}:${IMAGE_TAG:-latest}
    container_name: qa-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_URL=postgresql://qahub:qahub_secret@db:5432/qahub
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - qa-network

volumes:
  qahub_pgdata:

networks:
  qa-network:
    driver: bridge
