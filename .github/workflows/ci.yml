name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.7.1

      - name: Run ruff
        run: ruff check app tests

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    # Service containers — это контейнеры, которые GitHub запускает рядом
    # с job'ом. Они доступны по localhost:<port>.
    # Именно так гоняют тесты, которым нужна БД/Redis/очередь.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qahub
          POSTGRES_PASSWORD: qahub_secret
          POSTGRES_DB: qahub
        ports:
          - 5432:5432
        # Health check — GitHub ждёт, пока контейнер станет healthy,
        # прежде чем запускать шаги job'а.
        options: >-
          --health-cmd "pg_isready -U qahub -d qahub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # Переопределяем DATABASE_URL для CI. В config.py по умолчанию
      # тоже localhost:5432, но явное лучше неявного.
      DATABASE_URL: postgresql://qahub:qahub_secret@localhost:5432/qahub
      DEBUG: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: qa-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
